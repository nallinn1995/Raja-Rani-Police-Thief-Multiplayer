<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Play the classic Indian game of Raja Rani Police Chor (King, Queen, Police, Thief) online with friends. A fun, multiplayer party game of roles and deduction."

    <meta
      name="keywords"
      content="Raja Rani Police Chor, Raja Rani Police Thief, King Queen Police Thief, Multiplayer Game, Online Party Game, Indian Card Game, Raja Mantri Chor Sipahi"

    <link rel="preload" as="image" href="/assets/images/background.jpg" fetchpriority="high" />

    <script>
      window.__PWA_PROMPT__ = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__PWA_PROMPT__ = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
        console.log('[PWA Global] beforeinstallprompt captured early.');
      });
      window.addEventListener('appinstalled', function() {
        console.log('[PWA Global] appinstalled captured.');
        localStorage.setItem('raja_rani_app_installed', 'true');
        window.dispatchEvent(new CustomEvent('pwa_installed_success'));
      });
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
